resources:
  jobs:
    electrocasa_job:
      name: electrocasa-job-${bundle.target}
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 10800

      # Se dispara cuando llegan archivos nuevos al volume de landing.
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/${var.catalog}/default/vol_landing/
          min_time_between_triggers_seconds: 300
          wait_after_last_change_seconds: 120

      email_notifications:
        on_failure:
          - ${var.alert_email}
        on_duration_warning_threshold_exceeded:
          - ${var.alert_email}
        no_alert_for_skipped_runs: true

      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 5400

      # Tareas estrictamente en secuencia: Free Edition solo admite 1 pipeline activo por tipo.
      tasks:
        - task_key: copy_into_bronze
          notebook_task:
            notebook_path: ../notebooks/01_copy_into_bronze.sql
            base_parameters:
              catalog: ${var.catalog}
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          timeout_seconds: 1800

        - task_key: ingest_tracking
          depends_on:
            - task_key: copy_into_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.tracking_ingestion.id}
            full_refresh: false
          max_retries: 2
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          timeout_seconds: 3600

        - task_key: medallion_pipeline
          depends_on:
            - task_key: ingest_tracking
          pipeline_task:
            pipeline_id: ${resources.pipelines.electrocasa_medallion.id}
            full_refresh: false
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          timeout_seconds: 5400

        - task_key: validacion_calidad
          depends_on:
            - task_key: medallion_pipeline
          notebook_task:
            notebook_path: ../notebooks/02_validacion_y_gobierno.sql
            base_parameters:
              catalog: ${var.catalog}
          max_retries: 0
          timeout_seconds: 1800
